@for (transaction of getTransactions(); track transaction.id) {
  <div class="card mb-2">
    <div class="card-body d-flex justify-content-between align-items-center">
      <div>
        <p class="text-muted mb-1">{{ transaction.date | date: 'short' }}</p>
        <p class="mb-0">
          {{ getAccountFromId(transaction.from)?.name }}
          <span class="mx-1">→</span>
          {{ getAccountFromId(transaction.to)?.name }}
        </p>
      </div>
      <span class="fw-semibold fs-5">{{ transaction.amount | currency }}</span>
    </div>
  </div>
} @empty {
  <app-empty-state
    message="No transactions yet."
    ctaText="Make a transfer"
    ctaLink="/transfer"
  ></app-empty-state>
}
