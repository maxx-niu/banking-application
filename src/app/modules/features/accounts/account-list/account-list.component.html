<div>Available accounts:</div>
<br />
@for (account of accounts; track account.id) {
  <button (click)="selectAccount(account)">
    Account name: {{ account.name }} — Type: {{ account.type }} — Balance: ${{ account.balance }}
  </button>
}
<br />
<div>Currently on account: {{ currentAccount()?.name }}</div>
@if (currentAccount()) {
  <button (click)="handleLogout()">logout</button>
}
