<div class="mb-3">
  @if (accounts.length > 0) {
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">Your accounts ({{ accounts.length }}):</h4>
      <a class="btn btn-success d-flex gap-2" routerLink="/create-account">
        <i class="bi bi-plus-circle"></i>
        <span>New account</span>
      </a>
    </div>
  }

  @for (account of accounts; track account.id) {
    <div class="card mb-2">
      <div class="card-body d-flex justify-content-between align-items-center">
        <div>
          <h5 class="card-title mb-1">{{ account.name }}</h5>
          <span
            class="badge text-white mb-1"
            [style.background-color]="account.type === 'chequing' ? '#2563eb' : '#16a34a'"
          >
            {{ account.type }}
          </span>
          <p class="card-text text-muted mb-0">{{ account.balance | currency }}</p>
        </div>
        <button
          type="button"
          class="btn btn-outline-primary"
          (click)="handleViewHistory(account.id)"
        >
          View history
        </button>
      </div>
    </div>
  } @empty {
    <app-empty-state
      message="No other accounts available."
      ctaText="Create an account"
      ctaLink="/create-account"
    ></app-empty-state>
  }
</div>
