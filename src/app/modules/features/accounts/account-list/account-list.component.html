<div class="mb-3">
  @if (accounts.length > 0) {
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">Your accounts ({{ accounts.length }}):</h4>
      <a class="btn btn-outline-primary d-flex gap-2" routerLink="/create-account">
        <i class="bi bi-plus-circle"></i>
        <span>New account</span>
      </a>
    </div>
  }

  <div class="row g-3">
    @for (account of accounts; track account.id) {
      <div class="col-12 col-md-6">
        <div class="card h-100">
          <div
            class="card-header text-white d-flex align-items-center gap-2"
            [style.background-color]="account.type === 'chequing' ? '#2563eb' : '#16a34a'"
          >
            @if (account.type === 'chequing') {
              <i class="bi bi-currency-dollar"></i>
            } @else {
              <i class="bi bi-piggy-bank"></i>
            }
            <span class="fw-bold text-capitalize">{{ account.type }}</span>
          </div>

          <div class="card-body d-flex flex-column py-4">
            <h5 class="card-title fw-bold text-truncate">
              {{ account.name }}
            </h5>

            <span class="d-block small text-muted lh-sm">Current balance</span>
            <span class="d-block fs-4 mb-4 text-truncate">
              {{ account.balance | currency }}
            </span>

            <button
              type="button"
              class="btn btn-outline-primary mt-auto align-self-start"
              (click)="handleViewHistory(account.id)"
            >
              View history
            </button>
          </div>
        </div>
      </div>
    } @empty {
      <div class="col-12">
        <app-empty-state
          message="No other accounts available."
          ctaText="Create an account"
          ctaLink="/create-account"
        ></app-empty-state>
      </div>
    }
  </div>
</div>
