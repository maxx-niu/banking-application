<div class="mb-3">
  <label class="form-label">Other accounts:</label>
  @for (account of otherAccounts; track account.id) {
    <div class="card mb-2">
      <div class="card-body d-flex justify-content-between align-items-center">
        <div>
          <h5 class="card-title mb-1">{{ account.name }}</h5>
          <span
            class="badge text-white mb-1"
            [style.background-color]="account.type === 'chequing' ? '#2563eb' : '#16a34a'"
          >
            {{ account.type }}
          </span>
          <p class="card-text text-muted mb-0">{{ account.balance | currency }}</p>
        </div>
        <button type="button" class="btn btn-outline-primary" (click)="selectAccount(account)">
          Use this account
        </button>
      </div>
    </div>
  } @empty {
    <p class="text-muted">No other accounts available.</p>
  }
</div>
